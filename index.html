<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>奨学金・フェローシップ検索</title>
    <meta
      name="description"
      content="日本人学生・研究者向けの奨学金・フェローシップ情報を、日本語で検索・絞り込みできるデータベースです。"
    />
    <link rel="icon" type="image/png" href="uja-logo.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="hero">
        <div class="hero-brand">
          <img class="hero-logo" src="uja-logo.png" alt="UJA ロゴ" />
          <div class="hero-copy-block">
        <p class="eyebrow">助成金データベース</p>
        <h1>日本人学生・研究者向け 奨学金・フェローシップ検索</h1>
        <p class="hero-copy">
          奨学金・フェローシップを検索できます。
        </p>
          </div>
        </div>
      </header>

      <main class="layout">
        <aside class="filters" aria-label="検索フィルター">
          <form id="search-form" class="filters-form">
            <label class="field">
              <span>フリーワード検索</span>
              <input
                id="keyword-input"
                name="keyword"
                type="search"
                placeholder="運営団体、プログラム名、留学先国、留学目的、対象分野、募集期限などで検索"
              />
            </label>

            <p class="filters-help">
              タグで絞り込みながら、フリーワードでも検索できます。
            </p>

            <div id="filter-groups" class="filter-groups" aria-live="polite"></div>

            <button type="button" id="clear-filters">条件をクリア</button>
          </form>
        </aside>

        <section class="results-panel" aria-labelledby="results-heading">
          <div class="results-toolbar">
            <div>
              <h2 id="results-heading">検索結果</h2>
              <p class="results-caption">公開中のスプレッドシートから最新データを表示します。</p>
            </div>
            <p id="results-count" aria-live="polite">データを読み込んでいます...</p>
          </div>

          <div id="status-message" class="status-message" role="status" hidden></div>
          <div id="results" class="results-list"></div>
        </section>
      </main>
    </div>

    <script src="script.js" type="module"></script>
  </body>
</html>
